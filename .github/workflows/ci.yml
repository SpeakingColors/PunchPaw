# Builds on every push: the engine tests (no JUCE, with sanitizers), then the plugin and the self tests on Linux and Windows.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: punchpaw-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run the engine tests
        run: sh tests/run.sh
  plugin:
    needs: engine-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Build the plugin and the snapshot tool
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPP_BUILD_SNAPSHOT=ON
          cmake --build build --config Release --parallel 4
          find build -name "*.vst3" -maxdepth 6
      - name: Plugin self tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a build/PunchPawSnapshot_artefacts/Release/PunchPawSnapshot --selftest tests/fixtures/state-v1.xml
      - name: Render the real editor (screenshots)
        if: runner.os == 'Linux'
        run: |
          S=build/PunchPawSnapshot_artefacts/Release/PunchPawSnapshot
          mkdir -p shots
          xvfb-run -a $S shots/auto.png 2 C none 90 auto 2
          xvfb-run -a $S shots/manual.png 2 C none 90 manual 2
          xvfb-run -a $S shots/look-a.png 1 A none 90 auto 2
          xvfb-run -a $S shots/look-b.png 1 B none 90 auto 2
          xvfb-run -a $S shots/guide.png 1 C guide 30 auto 0
          xvfb-run -a $S shots/settings.png 1 C settings 30 auto 0
          xvfb-run -a $S shots/about.png 1 C about 30 auto 0
          xvfb-run -a $S shots/presets.png 1 C presets 30 auto 0
          xvfb-run -a $S shots/gr.png 2 C none 90 auto 2
          ls -l shots
      - name: Publish screenshots to the snapshots branch
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        run: |
          cd shots && git init -q && git checkout -q -b snapshots
          git config user.name SpeakingColors && git config user.email SpeakingColors@users.noreply.github.com
          git add . && git commit -q -m "Editor renders from CI"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshots
